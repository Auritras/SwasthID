name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App and server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SwasthID-Render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SwasthID-Render/package-lock.json
      - run: npm ci
      - name: Server tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-test-report
          path: |
            SwasthID-Render/playwright-report/
            SwasthID-Render/test-results/
          retention-days: 7

  emulator:
    name: Accounts and sync (Firebase emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SwasthID-Render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SwasthID-Render/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Emulator tests
        run: npm run test:emulator
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emulator-test-report
          path: |
            SwasthID-Render/playwright-report/
            SwasthID-Render/test-results/
          retention-days: 7

  push-worker:
    name: Reminder push Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SwasthID-Push-Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 for the built-in SQLite that stands in for Cloudflare D1.
          node-version: 22
      - run: npm test

  risk-api:
    name: Heart risk API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SwasthID-Risk-API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SwasthID-Risk-API/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
